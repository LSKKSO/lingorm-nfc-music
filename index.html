<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingOrm 音乐盒 · NFC 一碰播放</title>
<style>
  :root{--bg:#0e0e12;--card:#1a1a22;--accent:#e63946;--txt:#f5f5f7;--sub:#9aa0aa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;max-width:760px;margin:0 auto}
  h1{font-size:20px;margin-bottom:4px}
  .hint{color:var(--sub);font-size:13px;margin-bottom:14px}
  .now{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
  .disc{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#333 0 28%,#111 29% 100%);border:3px solid #444;flex:none;animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .now.paused .disc{animation-play-state:paused}
  .nowinfo{flex:1;min-width:0}
  .nowtitle{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  audio{width:100%;margin-top:8px}
  input#q{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#111;color:var(--txt);font-size:15px;margin-bottom:10px}
  ul{list-style:none}
  li{padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
  li:hover{background:var(--card)}
  li .n{color:var(--sub);font-size:12px;width:26px;flex:none}
  li .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  li.cur{background:var(--accent);color:#fff}
  .cnt{color:var(--sub);font-size:12px;margin-top:10px;text-align:center}
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:12px}
  .ovl[hidden]{display:none}
  .ovl .tip{color:#fff;font-size:14px}
  .ovl button{font-size:20px;padding:18px 34px;border:none;border-radius:50px;background:var(--accent);color:#fff;font-weight:700}
</style>
</head>
<body>
<h1>🎵 LingOrm 音乐盒</h1>
<div class="hint">NFC 一碰即播 · 手机浏览器会拦截自动播放，点一下「▶ 播放」即可开始（之后随机/顺序自动连播）· 共 138 首</div>
<div class="now paused" id="now">
  <div class="disc"></div>
  <div class="nowinfo">
    <div class="nowtitle" id="nt">点一首开始播放</div>
    <audio id="au" controls preload="none"></audio>
  </div>
</div>
<input id="q" placeholder="🔍 搜索歌名 / 歌手…">
<ul id="list"></ul>
<div class="cnt">由 WorkBuddy 生成 · 自托管免梯 · 国内外通用</div>
<div class="ovl" id="ovl" hidden><div class="tip">浏览器拦截了自动播放，点一下开始听 ♪</div><button id="ovlbtn">▶ 播放</button></div>
<script src="songs.js"></script>
<script>
/* SONGS array moved to songs.js */
const au=document.getElementById('au'), nt=document.getElementById('nt'), now=document.getElementById('now'), list=document.getElementById('list'), q=document.getElementById('q');
const ovl=document.getElementById('ovl'), ovlbtn=document.getElementById('ovlbtn');
const BASE='';
let CURRENT=null;
let QUEUE=[];
let qi=0;
function play(s){
  CURRENT=s; ovl.hidden=true;
  au.src=BASE+encodeURIComponent(s.f);
  nt.textContent=s.t; now.classList.remove('paused');
  [...list.children].forEach(li=>li.classList.toggle('cur',li.dataset.f===s.f));
  const p=au.play();
  if(p&&p.catch) p.catch(()=>{ ovlbtn.textContent='▶ 播放《'+s.t+'》'; ovl.hidden=false; });
}
function startFromGate(){ if(CURRENT) play(CURRENT); }
ovlbtn.onclick=(e)=>{e.stopPropagation();startFromGate();};
ovl.onclick=startFromGate;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQueue(arr){ QUEUE=arr; qi=0; play(QUEUE[0]); }
function render(arr){
  list.innerHTML='';
  arr.forEach((s,i)=>{
    const li=document.createElement('li'); li.dataset.f=s.f;
    li.innerHTML='<span class="n">'+(i+1)+'</span><span class="ti">'+s.t+'</span>';
    li.onclick=()=>{QUEUE=[];play(s);}; list.appendChild(li);
  });
}
const pm=new URLSearchParams(location.search);
if(pm.get('f')){
  const f=decodeURIComponent(pm.get('f'));
  const s=SONGS.find(x=>x.f===f)||{f:f,t:f};
  render(SONGS); QUEUE=[]; play(s);
}else if(pm.get('shuffle')){
  render(SONGS); startQueue(shuffle(SONGS));
}else if(pm.get('all')){
  render(SONGS); startQueue(SONGS);
}else{
  render(SONGS);
}
q.oninput=()=>{const k=q.value.trim().toLowerCase();render(SONGS.filter(s=>s.t.toLowerCase().includes(k)));};
au.onplay=()=>now.classList.remove('paused');
au.onpause=()=>now.classList.add('paused');
au.onended=()=>{ if(QUEUE.length && qi<QUEUE.length-1){ qi++; play(QUEUE[qi]); } };
</script>
</body>
</html>
